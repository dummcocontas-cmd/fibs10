<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle S10 - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <div class="mb-4">
                <img src="https://cdn.2rscms.com.br/uploads/561/header/topo_64c101769a3b8.png" alt="Logo" class="mx-auto" style="max-height: 80px;">
            </div>
            <h1 class="text-3xl font-bold text-gray-800">Controle S10</h1>
            <p class="text-gray-600 mt-2">Sistema de Registro de Viagens</p>
        </div>

        <!-- Formulário de Login -->
        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Selecione seu nome
                </label>
                <select id="funcionarioSelect" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white text-gray-800" required>
                    <option value="">Carregando funcionários...</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Senha
                </label>
                <input type="password" id="senhaInput" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white text-gray-800" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200 transform hover:scale-105">
                Entrar
            </button>
        </form>

        <!-- Link Admin -->
        <div class="mt-6 text-center">
            <a href="admin.html" class="text-sm text-blue-600 hover:text-blue-700 underline">
                Acesso Administrativo
            </a>
        </div>

        <!-- Status de carregamento -->
        <div id="loadingStatus" class="mt-4 text-center text-sm text-gray-500"></div>
    </div>

    <script type="module">
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDIfQhVgVCJ0BmNnmQX4ivU1W8E6SxvZeo",
            authDomain: "controle-s10.firebaseapp.com",
            projectId: "controle-s10",
            storageBucket: "controle-s10.firebasestorage.app",
            messagingSenderId: "76976890671",
            appId: "1:76976890671:web:86b96fef3193148f58b7da"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const funcionarioSelect = document.getElementById('funcionarioSelect');
        const loadingStatus = document.getElementById('loadingStatus');

        // Carregar funcionários do Firebase
        async function carregarFuncionarios() {
            try {
                loadingStatus.textContent = 'Carregando funcionários...';
                
                const snapshot = await db.collection('funcionarios').orderBy('nome').get();
                
                funcionarioSelect.innerHTML = '<option value="">-- Selecione seu nome --</option>';
                
                snapshot.forEach(doc => {
                    const funcionario = doc.data();
                    const option = document.createElement('option');
                    option.value = doc.id;
                    option.textContent = `${funcionario.nome} - ${funcionario.setor}`;
                    option.dataset.nome = funcionario.nome;
                    option.dataset.setor = funcionario.setor;
                    funcionarioSelect.appendChild(option);
                });

                loadingStatus.textContent = `${snapshot.size} funcionários carregados`;
                setTimeout(() => loadingStatus.textContent = '', 2000);
            } catch (error) {
                console.error('Erro ao carregar funcionários:', error);
                loadingStatus.textContent = 'Erro ao carregar funcionários. Verifique a configuração do Firebase.';
                loadingStatus.className = 'mt-4 text-center text-sm text-red-500';
            }
        }

        // Fazer login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const selectedOption = funcionarioSelect.options[funcionarioSelect.selectedIndex];
            const senhaDigitada = document.getElementById('senhaInput').value;
            
            if (!selectedOption.value) {
                alert('Por favor, selecione seu nome');
                return;
            }

            try {
                // Buscar dados do funcionário no Firebase
                const funcionarioDoc = await db.collection('funcionarios').doc(selectedOption.value).get();
                
                if (!funcionarioDoc.exists) {
                    alert('Funcionário não encontrado!');
                    return;
                }

                const funcionarioData = funcionarioDoc.data();

                // Validar senha
                if (funcionarioData.senha !== senhaDigitada) {
                    alert('Senha incorreta! Tente novamente.');
                    document.getElementById('senhaInput').value = '';
                    document.getElementById('senhaInput').focus();
                    return;
                }

                // Salvar no localStorage
                const dadosLogin = {
                    id: selectedOption.value,
                    nome: funcionarioData.nome,
                    setor: funcionarioData.setor
                };

                localStorage.setItem('funcionarioLogado', JSON.stringify(dadosLogin));
                
                // Redirecionar para a tela do funcionário
                window.location.href = 'funcionario.html';
            } catch (error) {
                console.error('Erro ao fazer login:', error);
                alert('Erro ao fazer login. Tente novamente.');
            }
        });

        // Carregar funcionários ao iniciar
        carregarFuncionarios();
    </script>
</body>
</html>
