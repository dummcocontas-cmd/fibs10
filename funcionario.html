<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle S10 - Funcionário</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Controle S10</h1>
                    <p class="text-gray-600" id="nomeUsuario">Carregando...</p>
                </div>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition">
                    Sair
                </button>
            </div>
        </div>

        <!-- Status do Carro -->
        <div id="statusCarro" class="bg-white rounded-2xl shadow-lg p-6 mb-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Status do Veículo</h2>
            <div id="statusContent" class="text-center py-4">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
                <p class="mt-4 text-gray-600">Verificando disponibilidade...</p>
            </div>
        </div>

        <!-- Ações -->
        <div class="grid md:grid-cols-2 gap-6">
            <!-- Registrar Saída -->
            <div class="bg-white rounded-2xl shadow-lg p-6">
                <div class="flex items-center mb-4">
                    <div class="bg-green-100 p-3 rounded-full mr-4">
                        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
                        </svg>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800">Registrar Saída</h3>
                </div>
                
                <form id="formSaida" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Destino</label>
                        <input type="text" id="destino" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500" required>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">KM Inicial</label>
                        <input type="number" id="kmInicial" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500" required>
                        <p class="text-xs text-gray-500 mt-1" id="kmInicialHint">Carregando último KM registrado...</p>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Observações (opcional)</label>
                        <textarea id="observacoesSaida" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500" rows="2"></textarea>
                    </div>
                    
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition">
                        🚗 Registrar Saída
                    </button>
                </form>
            </div>

            <!-- Registrar Devolução -->
            <div class="bg-white rounded-2xl shadow-lg p-6">
                <div class="flex items-center mb-4">
                    <div class="bg-blue-100 p-3 rounded-full mr-4">
                        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16l-4-4m0 0l4-4m-4 4h18"></path>
                        </svg>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800">Registrar Devolução</h3>
                </div>
                
                <form id="formDevolucao" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">KM Final</label>
                        <input type="number" id="kmFinal" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Observações (opcional)</label>
                        <textarea id="observacoesDevolucao" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" rows="2"></textarea>
                    </div>
                    
                    <div class="bg-gray-50 p-3 rounded-lg text-sm">
                        <p class="text-gray-600">Dados da saída:</p>
                        <p class="font-medium" id="dadosSaida">Nenhuma viagem ativa</p>
                    </div>
                    
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
                        ⬅️ Registrar Devolução
                    </button>
                </form>
            </div>
        </div>

        <!-- Minhas Últimas Viagens -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mt-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Minhas Últimas Viagens</h2>
            <div id="ultimasViagens" class="space-y-3">
                <p class="text-gray-500 text-center py-4">Carregando...</p>
            </div>
        </div>
    </div>

    <script type="module">
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDIfQhVgVCJ0BmNnmQX4ivU1W8E6SxvZeo",
            authDomain: "controle-s10.firebaseapp.com",
            projectId: "controle-s10",
            storageBucket: "controle-s10.firebasestorage.app",
            messagingSenderId: "76976890671",
            appId: "1:76976890671:web:86b96fef3193148f58b7da"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let funcionarioLogado = null;
        let viagemAtiva = null;

        // Verificar login
        function verificarLogin() {
            const dadosLogin = localStorage.getItem('funcionarioLogado');
            if (!dadosLogin) {
                window.location.href = 'index.html';
                return null;
            }
            return JSON.parse(dadosLogin);
        }

        // Logout
        window.logout = function() {
            localStorage.removeItem('funcionarioLogado');
            window.location.href = 'index.html';
        }

        // Verificar status do carro
        async function verificarStatusCarro() {
            try {
                const snapshot = await db.collection('viagens')
                    .where('status', '==', 'em_andamento')
                    .limit(1)
                    .get();

                if (!snapshot.empty) {
                    const viagem = snapshot.docs[0].data();
                    viagem.id = snapshot.docs[0].id;
                    
                    const isMinhaViagem = viagem.funcionarioId === funcionarioLogado.id;
                    
                    document.getElementById('statusContent').innerHTML = `
                        <div class="flex items-center justify-center ${isMinhaViagem ? 'text-green-600' : 'text-orange-600'}">
                            <svg class="w-12 h-12 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                            <div class="text-left">
                                <p class="font-bold text-lg">${isMinhaViagem ? 'Você está com o carro' : 'Carro em uso'}</p>
                                <p class="text-sm">${isMinhaViagem ? 'Lembre-se de devolver' : `Por: ${viagem.funcionarioNome}`}</p>
                            </div>
                        </div>
                    `;

                    if (isMinhaViagem) {
                        viagemAtiva = viagem;
                        document.getElementById('formSaida').style.display = 'none';
                        document.getElementById('dadosSaida').innerHTML = `
                            Destino: ${viagem.destino}<br>
                            Saída: ${new Date(viagem.horaSaida).toLocaleString('pt-BR')}<br>
                            KM Inicial: ${viagem.kmInicial}
                        `;
                    } else {
                        document.getElementById('formDevolucao').style.display = 'none';
                    }
                } else {
                    document.getElementById('statusContent').innerHTML = `
                        <div class="flex items-center justify-center text-green-600">
                            <svg class="w-12 h-12 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <div class="text-left">
                                <p class="font-bold text-lg">Carro Disponível</p>
                                <p class="text-sm">Pronto para uso</p>
                            </div>
                        </div>
                    `;
                    document.getElementById('formDevolucao').style.display = 'none';
                }
            } catch (error) {
                console.error('Erro ao verificar status:', error);
            }
        }

        // Buscar último KM registrado
        async function buscarUltimoKM() {
            try {
                // Buscar todas as viagens concluídas (sem orderBy para evitar necessidade de índice)
                const snapshot = await db.collection('viagens')
                    .where('status', '==', 'concluida')
                    .get();

                const kmInicialInput = document.getElementById('kmInicial');
                const kmInicialHint = document.getElementById('kmInicialHint');

                if (!snapshot.empty) {
                    // Ordenar manualmente no JavaScript
                    let viagensArray = [];
                    snapshot.forEach(doc => {
                        const viagem = doc.data();
                        if (viagem.kmFinal && viagem.horaChegada) {
                            viagensArray.push(viagem);
                        }
                    });

                    if (viagensArray.length > 0) {
                        // Ordenar por KM final (maior primeiro) - odômetro sempre aumenta!
                        viagensArray.sort((a, b) => {
                            return b.kmFinal - a.kmFinal;
                        });

                        const ultimaViagem = viagensArray[0];
                        const ultimoKM = ultimaViagem.kmFinal;
                        
                        // Pré-preencher o campo
                        kmInicialInput.value = ultimoKM;
                        kmInicialHint.innerHTML = `✅ Último KM registrado: <strong>${ultimoKM}</strong> (${ultimaViagem.funcionarioNome} em ${new Date(ultimaViagem.horaChegada).toLocaleString('pt-BR')}). <span class="text-blue-600">Confirme ou corrija se necessário.</span>`;
                        kmInicialHint.className = 'text-xs text-green-600 mt-1';
                    } else {
                        kmInicialHint.textContent = 'Nenhum KM final encontrado. Digite o KM atual do veículo.';
                        kmInicialHint.className = 'text-xs text-gray-500 mt-1';
                    }
                } else {
                    kmInicialHint.textContent = 'Nenhuma viagem concluída ainda. Digite o KM atual do veículo.';
                    kmInicialHint.className = 'text-xs text-gray-500 mt-1';
                }
            } catch (error) {
                console.error('Erro ao buscar último KM:', error);
                const kmInicialHint = document.getElementById('kmInicialHint');
                kmInicialHint.textContent = 'Erro ao buscar último KM: ' + error.message;
                kmInicialHint.className = 'text-xs text-red-500 mt-1';
            }
        }

        // Registrar saída
        document.getElementById('formSaida').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const destino = document.getElementById('destino').value;
            const kmInicial = parseInt(document.getElementById('kmInicial').value);
            const observacoes = document.getElementById('observacoesSaida').value;

            if (!confirm('Confirma o registro de saída?')) return;

            try {
                // Verificar novamente se o carro está disponível
                const verificacao = await db.collection('viagens')
                    .where('status', '==', 'em_andamento')
                    .limit(1)
                    .get();

                if (!verificacao.empty) {
                    alert('O carro já está em uso por outro funcionário!');
                    location.reload();
                    return;
                }

                await db.collection('viagens').add({
                    funcionarioId: funcionarioLogado.id,
                    funcionarioNome: funcionarioLogado.nome,
                    setor: funcionarioLogado.setor,
                    destino: destino,
                    horaSaida: new Date().toISOString(),
                    horaChegada: null,
                    kmInicial: kmInicial,
                    kmFinal: null,
                    observacoes: observacoes,
                    status: 'em_andamento'
                });

                alert('Saída registrada com sucesso!');
                location.reload();
            } catch (error) {
                console.error('Erro ao registrar saída:', error);
                alert('Erro ao registrar saída. Tente novamente.');
            }
        });

        // Registrar devolução
        document.getElementById('formDevolucao').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!viagemAtiva) {
                alert('Você não possui uma viagem ativa.');
                return;
            }

            const kmFinal = parseInt(document.getElementById('kmFinal').value);
            const observacoesDevolucao = document.getElementById('observacoesDevolucao').value;

            if (kmFinal < viagemAtiva.kmInicial) {
                alert('KM final não pode ser menor que KM inicial!');
                return;
            }

            if (!confirm('Confirma o registro de devolução?')) return;

            try {
                const observacoesCompletas = viagemAtiva.observacoes 
                    ? `${viagemAtiva.observacoes}\n\nDevolução: ${observacoesDevolucao}`
                    : observacoesDevolucao;

                await db.collection('viagens').doc(viagemAtiva.id).update({
                    horaChegada: new Date().toISOString(),
                    kmFinal: kmFinal,
                    observacoes: observacoesCompletas,
                    status: 'concluida'
                });

                alert('Devolução registrada com sucesso!');
                location.reload();
            } catch (error) {
                console.error('Erro ao registrar devolução:', error);
                alert('Erro ao registrar devolução. Tente novamente.');
            }
        });

        // Carregar últimas viagens
        async function carregarUltimasViagens() {
            try {
                const snapshot = await db.collection('viagens')
                    .where('funcionarioId', '==', funcionarioLogado.id)
                    .orderBy('horaSaida', 'desc')
                    .limit(5)
                    .get();

                const container = document.getElementById('ultimasViagens');
                
                if (snapshot.empty) {
                    container.innerHTML = '<p class="text-gray-500 text-center py-4">Nenhuma viagem registrada ainda.</p>';
                    return;
                }

                container.innerHTML = '';
                snapshot.forEach(doc => {
                    const viagem = doc.data();
                    const kmRodados = viagem.kmFinal ? viagem.kmFinal - viagem.kmInicial : '-';
                    
                    container.innerHTML += `
                        <div class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition">
                            <div class="flex justify-between items-start">
                                <div class="flex-1">
                                    <p class="font-semibold text-gray-800">${viagem.destino}</p>
                                    <p class="text-sm text-gray-600">
                                        ${new Date(viagem.horaSaida).toLocaleString('pt-BR')}
                                        ${viagem.horaChegada ? ` - ${new Date(viagem.horaChegada).toLocaleString('pt-BR')}` : ' (Em andamento)'}
                                    </p>
                                    <p class="text-sm text-gray-600">KM: ${viagem.kmInicial} → ${viagem.kmFinal || '?'} (${kmRodados}${kmRodados !== '-' ? ' km' : ''})</p>
                                </div>
                                <span class="px-3 py-1 rounded-full text-xs font-semibold ${viagem.status === 'em_andamento' ? 'bg-orange-100 text-orange-700' : 'bg-green-100 text-green-700'}">
                                    ${viagem.status === 'em_andamento' ? 'Em andamento' : 'Concluída'}
                                </span>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Erro ao carregar viagens:', error);
            }
        }

        // Inicializar
        funcionarioLogado = verificarLogin();
        if (funcionarioLogado) {
            document.getElementById('nomeUsuario').textContent = `${funcionarioLogado.nome} - ${funcionarioLogado.setor}`;
            verificarStatusCarro().then(() => {
                // Só buscar último KM se o formulário de saída estiver visível
                if (document.getElementById('formSaida').style.display !== 'none') {
                    buscarUltimoKM();
                }
            });
            carregarUltimasViagens();
        }
    </script>
</body>
</html>
