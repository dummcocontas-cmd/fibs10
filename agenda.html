<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda S10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">📅 Agenda da S10</h1>
                    <p class="text-gray-600" id="nomeUsuario">Carregando...</p>
                </div>
                <button onclick="location.href='funcionario.html'" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg transition">
                    ← Voltar
                </button>
            </div>
        </div>

        <!-- Botão Novo Agendamento -->
        <div class="mb-6">
            <button onclick="mostrarFormAgendamento()" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition">
                ➕ Fazer Novo Agendamento
            </button>
        </div>

        <!-- Lista de Agendamentos -->
        <div class="bg-white rounded-2xl shadow-lg p-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Próximos Agendamentos</h2>
            <div id="listaAgendamentos" class="space-y-3">
                <p class="text-gray-500 text-center py-4">Carregando...</p>
            </div>
        </div>
    </div>

    <!-- Modal de Novo Agendamento -->
    <div id="modalAgendamento" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800">📅 Novo Agendamento</h3>
                <button onclick="fecharFormAgendamento()" class="text-gray-500 hover:text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <form id="formAgendamento" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Data</label>
                    <input type="date" id="dataAgendamento" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500" required>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Hora Início</label>
                        <input type="time" id="horaInicio" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Hora Fim</label>
                        <input type="time" id="horaFim" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500" required>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Destino</label>
                    <input type="text" id="destinoAgendamento" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500" placeholder="Ex: Indepar" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Observações (opcional)</label>
                    <textarea id="observacoesAgendamento" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500" rows="2" placeholder="Ex: Comprar parafuso"></textarea>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="submit" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition">
                        ✅ Agendar
                    </button>
                    <button type="button" onclick="fecharFormAgendamento()" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-semibold py-3 rounded-lg transition">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDIfQhVgVCJ0BmNnmQX4ivU1W8E6SxvZeo",
            authDomain: "controle-s10.firebaseapp.com",
            projectId: "controle-s10",
            storageBucket: "controle-s10.firebasestorage.app",
            messagingSenderId: "76976890671",
            appId: "1:76976890671:web:86b96fef3193148f58b7da"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let funcionarioLogado = null;

        // Verificar login
        function verificarLogin() {
            const dadosLogin = localStorage.getItem('funcionarioLogado');
            if (!dadosLogin) {
                window.location.href = 'index.html';
                return null;
            }
            return JSON.parse(dadosLogin);
        }

        // Mostrar formulário de agendamento
        window.mostrarFormAgendamento = function() {
            // Definir data mínima como hoje
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('dataAgendamento').setAttribute('min', hoje);
            document.getElementById('dataAgendamento').value = hoje;
            
            document.getElementById('modalAgendamento').classList.remove('hidden');
        }

        // Fechar formulário
        window.fecharFormAgendamento = function() {
            document.getElementById('modalAgendamento').classList.add('hidden');
            document.getElementById('formAgendamento').reset();
        }

        // Criar agendamento
        document.getElementById('formAgendamento').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = document.getElementById('dataAgendamento').value;
            const horaInicio = document.getElementById('horaInicio').value;
            const horaFim = document.getElementById('horaFim').value;
            const destino = document.getElementById('destinoAgendamento').value;
            const observacoes = document.getElementById('observacoesAgendamento').value;

            // Validar horários
            if (horaFim <= horaInicio) {
                alert('Hora de fim deve ser maior que hora de início!');
                return;
            }

            const dataInicio = `${data}T${horaInicio}:00`;
            const dataFim = `${data}T${horaFim}:00`;

            if (!confirm(`Confirma o agendamento para ${new Date(dataInicio).toLocaleString('pt-BR')}?`)) {
                return;
            }

            try {
                // Buscar telefone do funcionário
                const funcDoc = await db.collection('funcionarios').doc(funcionarioLogado.id).get();
                const telefone = funcDoc.data().telefone || 'Não informado';

                await db.collection('agendamentos').add({
                    funcionarioId: funcionarioLogado.id,
                    funcionarioNome: funcionarioLogado.nome,
                    setor: funcionarioLogado.setor,
                    telefone: telefone,
                    dataInicio: dataInicio,
                    dataFim: dataFim,
                    destino: destino,
                    observacoes: observacoes,
                    status: 'ativo',
                    criadoEm: new Date().toISOString()
                });

                alert('✅ Agendamento criado com sucesso!');
                fecharFormAgendamento();
                carregarAgendamentos();
            } catch (error) {
                console.error('Erro ao criar agendamento:', error);
                alert('❌ Erro ao criar agendamento: ' + error.message);
            }
        });

        // Carregar agendamentos
        async function carregarAgendamentos() {
            try {
                const agora = new Date();
                
                // Query simplificada - buscar todos ativos e filtrar no JavaScript
                const snapshot = await db.collection('agendamentos')
                    .where('status', '==', 'ativo')
                    .get();

                const lista = document.getElementById('listaAgendamentos');

                // Filtrar apenas futuros no JavaScript
                let agendamentos = [];
                snapshot.forEach(doc => {
                    const dados = doc.data();
                    const dataFim = new Date(dados.dataFim);
                    
                    // Só adiciona se for futuro
                    if (dataFim >= agora) {
                        agendamentos.push({
                            id: doc.id,
                            ...dados
                        });
                    }
                });

                if (agendamentos.length === 0) {
                    lista.innerHTML = '<p class="text-gray-500 text-center py-4">Nenhum agendamento futuro.</p>';
                    return;
                }

                // Ordenar por data
                agendamentos.sort((a, b) => new Date(a.dataInicio) - new Date(b.dataInicio));

                lista.innerHTML = '';
                let dataAnterior = null;

                agendamentos.forEach(agendamento => {
                    const dataInicio = new Date(agendamento.dataInicio);
                    const dataFim = new Date(agendamento.dataFim);
                    const dataStr = dataInicio.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });

                    // Mostrar separador de data
                    if (dataStr !== dataAnterior) {
                        lista.innerHTML += `
                            <div class="mt-4 mb-2 font-bold text-gray-700 capitalize">
                                ${dataStr}
                            </div>
                        `;
                        dataAnterior = dataStr;
                    }

                    const isMeu = agendamento.funcionarioId === funcionarioLogado.id;
                    const corBorda = isMeu ? 'border-l-4 border-green-500' : 'border-l-4 border-blue-500';

                    lista.innerHTML += `
                        <div class="${corBorda} bg-gray-50 rounded-lg p-4 hover:bg-gray-100 transition">
                            <div class="flex justify-between items-start">
                                <div class="flex-1">
                                    <div class="flex items-center gap-2 mb-2">
                                        <span class="font-semibold text-gray-800">${agendamento.funcionarioNome}</span>
                                        ${isMeu ? '<span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded">Meu</span>' : ''}
                                    </div>
                                    <p class="text-sm text-gray-600">
                                        ⏰ ${dataInicio.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })} - ${dataFim.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}
                                    </p>
                                    <p class="text-sm text-gray-600">📍 ${agendamento.destino}</p>
                                    <p class="text-sm text-gray-600">📞 ${agendamento.telefone}</p>
                                    ${agendamento.observacoes ? `<p class="text-sm text-gray-500 mt-1">💬 ${agendamento.observacoes}</p>` : ''}
                                </div>
                                ${isMeu ? `
                                    <button onclick="cancelarAgendamento('${agendamento.id}')" class="text-red-600 hover:text-red-800 ml-4" title="Cancelar">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                        </svg>
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Erro ao carregar agendamentos:', error);
                console.error('Código do erro:', error.code);
                console.error('Mensagem:', error.message);
                document.getElementById('listaAgendamentos').innerHTML = `
                    <div class="text-center py-4">
                        <p class="text-red-500">Erro ao carregar agendamentos</p>
                        <p class="text-sm text-gray-600 mt-2">${error.message}</p>
                        <button onclick="carregarAgendamentos()" class="mt-3 bg-blue-500 text-white px-4 py-2 rounded">
                            Tentar novamente
                        </button>
                    </div>
                `;
            }
        }

        // Cancelar agendamento
        window.cancelarAgendamento = async function(id) {
            if (!confirm('Tem certeza que deseja cancelar este agendamento?')) {
                return;
            }

            try {
                await db.collection('agendamentos').doc(id).update({
                    status: 'cancelado'
                });

                alert('✅ Agendamento cancelado!');
                carregarAgendamentos();
            } catch (error) {
                console.error('Erro ao cancelar agendamento:', error);
                alert('❌ Erro ao cancelar agendamento.');
            }
        }

        // Inicializar
        funcionarioLogado = verificarLogin();
        if (funcionarioLogado) {
            document.getElementById('nomeUsuario').textContent = `${funcionarioLogado.nome} - ${funcionarioLogado.setor}`;
            carregarAgendamentos();
        }
    </script>
</body>
</html>
